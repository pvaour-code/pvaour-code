<svg xmlns="http://www.w3.org/2000/svg" width="440" height="369" viewBox="0 0 440 369" role="img"><title>A fictional catalogue enquiry, its owner and its follow-up</title><style>@keyframes arrive{0%{opacity:0}30%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.scan,.ripple{opacity:0!important}}</style><rect x="0" y="0" width="440" height="369" rx="14" fill="#141820" /><text x="22" y="32" font-family="monospace" font-size="14" fill="#a8d9ff" >B2B LEAD CRM  /  FICTIONAL EXAMPLE</text><text x="20" y="73" font-family="Georgia,serif" font-size="32" fill="#f5f1e7" >One catalogue enquiry</text><rect x="20" y="101" width="400" height="74" rx="6" fill="#1b202b" /><text x="32" y="130" font-family="monospace" font-size="16" fill="#a8d9ff" >10:02</text><text x="105" y="130" font-family="system-ui,sans-serif" font-size="22" fill="#f5f1e7" >Enquiry received</text><text x="105" y="155" font-family="system-ui,sans-serif" font-size="17" fill="#afbdce" >Catalogue requested.</text><rect x="20" y="101" width="3" height="74" rx="1" fill="#a8d9ff" opacity="0" class="ripple" style="animation:arrive 1s 0.00s both"/><rect x="20" y="188" width="400" height="74" rx="6" fill="#1b202b" /><text x="32" y="217" font-family="monospace" font-size="16" fill="#a8d9ff" >10:03</text><text x="105" y="217" font-family="system-ui,sans-serif" font-size="22" fill="#f5f1e7" >Owner assigned</text><text x="105" y="242" font-family="system-ui,sans-serif" font-size="17" fill="#afbdce" >Demo Rep A takes it.</text><rect x="20" y="188" width="3" height="74" rx="1" fill="#a8d9ff" opacity="0" class="ripple" style="animation:arrive 1s 0.85s both"/><rect x="20" y="275" width="400" height="74" rx="6" fill="#1b202b" /><text x="32" y="304" font-family="monospace" font-size="16" fill="#a8d9ff" >10:05</text><text x="105" y="304" font-family="system-ui,sans-serif" font-size="22" fill="#f5f1e7" >Call scheduled</text><text x="105" y="329" font-family="system-ui,sans-serif" font-size="